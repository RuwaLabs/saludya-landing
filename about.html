<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sobre RuwaLabs y SaludYa: startup peruana que digitaliza la gestión de citas en establecimientos públicos de salud.">
  <meta name="keywords" content="RuwaLabs, SaludYa, startup Perú, salud pública, UPC, Ingeniería de Software">
  <meta name="robots" content="index, follow">

  <title>Sobre nosotros — SaludYa | RuwaLabs</title>

  <link rel="icon" type="image/png" href="assets/img/icon-saludya.png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- [MEJORA] role="banner" eliminado -->
  <header class="site-header">
    <div class="container header-inner">
      <!-- [MEJORA] .brand ahora es un <a> semántico -->
      <a href="index.html" class="brand" aria-label="SaludYa — Inicio">
        <img src="assets/img/logo-saludya.png" alt="" class="brand-logo">
        <span class="brand-name" data-i18n="brand.name"></span>
      </a>

      <div class="header-end">
        <button class="nav-toggle" data-i18n-attr="aria-label:nav.toggleOpen" aria-expanded="false" aria-controls="primary-nav">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>

        <!-- [MEJORA] role="navigation" eliminado -->
        <nav id="primary-nav" class="primary-nav" data-i18n-attr="aria-label:nav.ariaLabel">
          <ul class="nav-list">
            <li><a href="index.html#problem" data-i18n="nav.product"></a></li>
            <li><a href="index.html#videos" data-i18n="nav.videos"></a></li>
            <li><a href="about.html" data-i18n="nav.about" class="is-active"></a></li>
            <li><a href="terms.html" data-i18n="nav.contact"></a></li>
          </ul>

          <div class="lang-switch" role="group" data-i18n-attr="aria-label:lang.ariaLabel">
            <button type="button" class="lang-btn is-active" data-lang="es" aria-pressed="true">ES</button>
            <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
          </div>

          <a href="index.html#download" class="btn btn-primary nav-cta" data-i18n="nav.cta"></a>
        </nav>
      </div>
    </div>
  </header>

  <main id="main" role="main">

    <section class="section section-about-hero" aria-labelledby="about-title">
      <div class="container">
        <h1 id="about-title" data-i18n="about.title"></h1>
        <p data-i18n="about.subtitle"></p>
      </div>
    </section>

    <section class="section" aria-labelledby="mission-title">
      <div class="container">
        <h2 id="mission-title" data-i18n="about.mission.title"></h2>
        <p data-i18n="about.mission.text"></p>

        <h2 data-i18n="about.vision.title"></h2>
        <p data-i18n="about.vision.text"></p>

        <h2 data-i18n="about.values.title"></h2>
        <ul class="values-list">
          <li data-i18n="about.values.v1"></li>
          <li data-i18n="about.values.v2"></li>
          <li data-i18n="about.values.v3"></li>
          <li data-i18n="about.values.v4"></li>
        </ul>
      </div>
    </section>

    <section class="section section-team" aria-labelledby="about-team-title">
      <div class="container">
        <h2 id="about-team-title" data-i18n="about.team.title"></h2>
        <ul class="team-list">
          <li class="team-member">
            <img src="assets/img/team/rodrigo.jpg" alt="" class="team-photo" loading="lazy" data-i18n-attr="alt:team.members.rodrigoAlt">
            <strong data-i18n="team.members.rodrigo"></strong>
            <span data-i18n="team.role.dev"></span>
          </li>
          <li class="team-member">
            <img src="assets/img/team/didier.jpg" alt="" class="team-photo" loading="lazy" data-i18n-attr="alt:team.members.didierAlt">
            <strong data-i18n="team.members.didier"></strong>
            <span data-i18n="team.role.research"></span>
          </li>
          <li class="team-member">
            <img src="assets/img/team/paula.jpg" alt="" class="team-photo" loading="lazy" data-i18n-attr="alt:team.members.paulaAlt">
            <strong data-i18n="team.members.paula"></strong>
            <span data-i18n="team.role.docs"></span>
          </li>
          <li class="team-member">
            <img src="assets/img/team/neo.jpg" alt="" class="team-photo" loading="lazy" data-i18n-attr="alt:team.members.neoAlt">
            <strong data-i18n="team.members.neo"></strong>
            <span data-i18n="team.role.ux"></span>
          </li>
          <li class="team-member">
            <img src="assets/img/team/alisee.jpg" alt="" class="team-photo" loading="lazy" data-i18n-attr="alt:team.members.aliseeAlt">
            <strong data-i18n="team.members.alisee"></strong>
            <span data-i18n="team.role.qa"></span>
          </li>
        </ul>
      </div>
    </section>

    <section class="section" aria-labelledby="contact-title">
      <div class="container">
        <h2 id="contact-title" data-i18n="about.contact.title"></h2>
        <p data-i18n="about.contact.text"></p>
      </div>
    </section>

  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <div class="footer-col">
        <img src="assets/img/logo-saludya.png" alt="" class="footer-logo">
        <p data-i18n="footer.tagline"></p>
      </div>
      <div class="footer-col">
        <h3 data-i18n="footer.links"></h3>
        <ul>
          <li><a href="index.html#problem" data-i18n="nav.product"></a></li>
          <li><a href="index.html#videos" data-i18n="nav.videos"></a></li>
          <li><a href="about.html" data-i18n="nav.about"></a></li>
          <li><a href="terms.html" data-i18n="nav.contact"></a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h3 data-i18n="footer.legal"></h3>
        <ul>
          <li><a href="terms.html" data-i18n="footer.terms"></a></li>
          <li><a href="terms.html#privacy" data-i18n="footer.privacy"></a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h3 data-i18n="footer.contact"></h3>
        <ul>
          <li><a href="mailto:contacto@saludya.pe">contacto@saludya.pe</a></li>
          <li><a href="https://github.com/RuwaLabs" target="_blank" rel="noopener">GitHub RuwaLabs</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <p data-i18n="footer.copyright"></p>
    </div>
  </footer>

  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
