<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Términos y condiciones de servicio y política de privacidad de SaludYa, plataforma de RuwaLabs.">
  <meta name="robots" content="index, follow">

  <title>Términos y condiciones — SaludYa</title>

  <link rel="icon" type="image/png" href="assets/img/icon-saludya.png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- [MEJORA] role="banner" eliminado -->
  <header class="site-header">
    <div class="container header-inner">
      <!-- [MEJORA] .brand ahora es un <a> semántico -->
      <a href="index.html" class="brand" aria-label="SaludYa — Inicio">
        <img src="assets/img/logo-saludya.png" alt="" class="brand-logo">
        <span class="brand-name" data-i18n="brand.name"></span>
      </a>

      <div class="header-end">
        <button class="nav-toggle" data-i18n-attr="aria-label:nav.toggleOpen" aria-expanded="false" aria-controls="primary-nav">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>

        <!-- [MEJORA] role="navigation" eliminado -->
        <nav id="primary-nav" class="primary-nav" data-i18n-attr="aria-label:nav.ariaLabel">
          <ul class="nav-list">
            <li><a href="index.html#problem" data-i18n="nav.product"></a></li>
            <li><a href="index.html#videos" data-i18n="nav.videos"></a></li>
            <li><a href="about.html" data-i18n="nav.about"></a></li>
            <li><a href="terms.html" data-i18n="nav.contact" class="is-active"></a></li>
          </ul>

          <div class="lang-switch" role="group" data-i18n-attr="aria-label:lang.ariaLabel">
            <button type="button" class="lang-btn is-active" data-lang="es" aria-pressed="true">ES</button>
            <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
          </div>

          <a href="index.html#download" class="btn btn-primary nav-cta" data-i18n="nav.cta"></a>
        </nav>
      </div>
    </div>
  </header>

  <main id="main" role="main">

    <section class="section" aria-labelledby="terms-title">
      <div class="container legal-content">
        <h1 id="terms-title" data-i18n="terms.title"></h1>
        <p class="legal-updated" data-i18n="terms.updated"></p>

        <h2 data-i18n="terms.s1.title"></h2>
        <p data-i18n="terms.s1.text"></p>

        <h2 data-i18n="terms.s2.title"></h2>
        <p data-i18n="terms.s2.text"></p>

        <h2 data-i18n="terms.s3.title"></h2>
        <p data-i18n="terms.s3.text"></p>

        <h2 data-i18n="terms.s4.title"></h2>
        <p data-i18n="terms.s4.text"></p>

        <h2 data-i18n="terms.s5.title"></h2>
        <p data-i18n="terms.s5.text"></p>

        <h2 data-i18n="terms.s6.title"></h2>
        <p data-i18n="terms.s6.text"></p>

        <h2 data-i18n="terms.s7.title"></h2>
        <p data-i18n="terms.s7.text"></p>

        <h2 data-i18n="terms.s8.title"></h2>
        <p data-i18n="terms.s8.text"></p>

        <h2 id="privacy" data-i18n="terms.privacy.title"></h2>
        <p data-i18n="terms.privacy.p1"></p>
        <p data-i18n="terms.privacy.p2"></p>

        <h2 data-i18n="terms.contact.title"></h2>
        <p data-i18n="terms.contact.text"></p>
      </div>
    </section>

  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <div class="footer-col">
        <img src="assets/img/logo-saludya.png" alt="" class="footer-logo">
        <p data-i18n="footer.tagline"></p>
      </div>
      <div class="footer-col">
        <h3 data-i18n="footer.links"></h3>
        <ul>
          <li><a href="index.html#problem" data-i18n="nav.product"></a></li>
          <li><a href="index.html#videos" data-i18n="nav.videos"></a></li>
          <li><a href="about.html" data-i18n="nav.about"></a></li>
          <li><a href="terms.html" data-i18n="nav.contact"></a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h3 data-i18n="footer.legal"></h3>
        <ul>
          <li><a href="terms.html" data-i18n="footer.terms"></a></li>
          <li><a href="terms.html#privacy" data-i18n="footer.privacy"></a></li>
        </ul>
      </div>
      <div class="footer-col">
        <h3 data-i18n="footer.contact"></h3>
        <ul>
          <li><a href="mailto:contacto@saludya.pe">contacto@saludya.pe</a></li>
          <li><a href="https://github.com/RuwaLabs" target="_blank" rel="noopener">GitHub RuwaLabs</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <p data-i18n="footer.copyright"></p>
    </div>
  </footer>

  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
